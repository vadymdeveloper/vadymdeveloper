name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          filename: github-metrics-languages.svg
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: lines, percentage
          plugin_languages_limit: 0
          plugin_languages_sections: most-used
          plugin_languages_categories: programming
          plugin_languages_ignored: >-
            html, css, javascript, typescript, sql, shell, dockerfile, json, markdown, yaml, makefile, batch, powershell
          plugin_languages_aliases: "c#:C#, kotlin:Kotlin, python:Python, rust:Rust"
          commits_authoring: vadymdeveloper, dev.vadymhrynyk@gmail.com
          repositories_limit: 100
          config_allow_private: yes
          committer_token: ${{ secrets.GITHUB_TOKEN }}
